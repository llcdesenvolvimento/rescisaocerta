    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como calcular a rescisão trabalhista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A rescisão trabalhista é calculada somando todas as verbas devidas: saldo de salário, 13º proporcional, férias proporcionais com 1/3, aviso prévio e multa de 40% do FGTS (na demissão sem justa causa). O cálculo varia conforme o tipo de desligamento e o tempo de serviço."
          }
        },
        {
          "@type": "Question",
          "name": "Quais são os direitos na demissão sem justa causa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Na demissão sem justa causa, o trabalhador tem direito a: saldo de salário, aviso prévio (trabalhado ou indenizado), 13º salário proporcional, férias proporcionais + 1/3, férias vencidas + 1/3, multa de 40% sobre o FGTS, saque do FGTS e seguro-desemprego."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o prazo para receber a rescisão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O empregador tem até 10 dias corridos após o término do contrato para efetuar o pagamento das verbas rescisórias, conforme o artigo 477, §6º, da CLT. O descumprimento gera multa equivalente a um salário do empregado."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o aviso prévio proporcional?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O aviso prévio é de no mínimo 30 dias, acrescido de 3 dias por ano completo de serviço, podendo chegar a 90 dias no total. Na demissão sem justa causa, se indenizado, o valor é pago integralmente ao trabalhador."
          }
        }
      ]
    }
    </script>
